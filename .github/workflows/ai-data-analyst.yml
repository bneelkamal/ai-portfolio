name: AI Data Analyst CI

on:
  push:
    paths:
      - "projects/ai-data-analyst/**"
      - ".github/workflows/ai-data-analyst.yml"
  pull_request:
    paths:
      - "projects/ai-data-analyst/**"
      - ".github/workflows/ai-data-analyst.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/ai-data-analyst
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Run tests
        run: pytest
      - name: Compile Python modules
        run: python -m compileall -q .
